plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def routeSecrets = new Properties()
def routeSecretsFile = rootProject.file("secrets.properties")
if (routeSecretsFile.exists()) {
    routeSecretsFile.withInputStream { routeSecrets.load(it) }
}
def routesApiKey = routeSecrets.getProperty("ROUTES_API_KEY", "")

android {
    namespace 'com.pandalfinder'
    // MapLibre's current AndroidX transitive dependencies require API 34 to compile.
    compileSdk 34

    defaultConfig {
        applicationId "com.pandalfinder"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "GOOGLE_ROUTES_API_KEY", "\"${routesApiKey.replace('\\', '\\\\').replace('\"', '\\\"')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    
    // Google Play Services for Location
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // MapLibre renders OpenStreetMap-compatible map styles without a Google Maps key.
    implementation 'org.maplibre.gl:android-sdk:11.8.0'

    // Firestore is deliberately configuration-free in source. Add google-services.json
    // for the project's Firebase app before enabling live crowd reports.
    implementation 'com.google.firebase:firebase-firestore-ktx:25.1.1'

    testImplementation 'junit:junit:4.13.2'
}
